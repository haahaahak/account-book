server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/accountbook?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # create / update / validate / none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher # Spring Boot 2.6+ 대응

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true